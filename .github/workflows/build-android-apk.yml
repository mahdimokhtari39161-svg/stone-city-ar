name: Build Stone City Android APK
# Camera permission is inserted inside the manifest root element.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -R icons www/icons

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^7 @capacitor/android@^7 @capacitor/cli@^7

      - name: Configure native Android app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.stonecity.ar",
            "appName": "Stone City AR",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android


      - name: Generate Android launcher icons
        run: |
          npm install --no-save sharp
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir } from 'node:fs/promises';
          const svg = 'icons/app-icon.svg';
          const densities = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          for (const [density, size] of Object.entries(densities)) {
            const dir = `android/app/src/main/res/mipmap-${density}`;
            await mkdir(dir, { recursive: true });
            await sharp(svg).resize(size, size).png().toFile(`${dir}/ic_launcher.png`);
            await sharp(svg).resize(size, size).png().toFile(`${dir}/ic_launcher_round.png`);
          }
          NODE

      - name: Add camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(p)
          root = tree.getroot()
          tag = "uses-permission"
          attr = "{http://schemas.android.com/apk/res/android}name"
          if not any(e.tag == tag and e.get(attr) == "android.permission.CAMERA" for e in root):
              permission = ET.Element(tag)
              permission.set(attr, "android.permission.CAMERA")
              app = root.find("application")
              if app is None:
                  root.append(permission)
              else:
                  root.insert(list(root).index(app), permission)
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stone-City-AR-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
